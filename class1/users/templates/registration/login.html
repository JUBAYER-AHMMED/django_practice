{% extends "base.html" %}
{% block content %}
    <div class="w-1/2 mx-auto">
        <h1 class="mt-6 mb-4 text-center text-3xl md:text-4xl">Login Page</h1>
        {% if messages %} 
           {% for message in messages %}
              <p class="px-2 py-1 {% if message.tags == 'success' %}bg-green-500{% endif %} ">{{message}}</p>
           {% endfor %}
        {% endif %}


        <form action="" method="POST" class="mx-auto flex flex-col justify-center">
            {% csrf_token %}
            {% comment %} 
                <input type="text" name="username" placeholder="Enter Your Username">
                <input type="password" name="password" placeholder="Enter Your Password">
            {% endcomment %}
            {{form}}
            <button type="submit" class="my-3 px-2 py-1 text-white mx-auto rounded-sm bg-slate-700">Sign In</button>
        </form>
        <p class="text-center"><a href="{% url "password_reset" %}">Forfot Password?</a></p>

    </div>
{% endblock content %}
